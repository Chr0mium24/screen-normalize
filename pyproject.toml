[project]
name = "screen-normalize"
version = "0.1.0"
description = "Screen perspective normalization experiment pipeline"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.10",
  "numpy>=2.2",
  "opencv-python-headless>=4.12",
]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

