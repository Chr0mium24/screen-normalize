<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>屏幕四角人工标注</title>
  <style>
    :root{color-scheme:dark;--bg:#101319;--panel:#191e27;--line:#303847;--muted:#98a3b5;--accent:#53d59a;--danger:#ff6474}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef2f8;font:14px system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}
    button,input,select{font:inherit;color:inherit;background:#242b37;border:1px solid var(--line);border-radius:7px;padding:7px 10px}button{cursor:pointer}button:hover{border-color:#68758b}button.primary{background:#147a55;border-color:#35b87f}button.danger{color:#ffb1ba}button:disabled{opacity:.4;cursor:not-allowed}
    header{height:54px;display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:#151922}header h1{font-size:16px;margin:0}.grow{flex:1}.muted{color:var(--muted)}
    main{display:grid;grid-template-columns:290px minmax(420px,1fr) 400px;height:calc(100vh - 54px);min-height:0;overflow:hidden}aside,.right{background:var(--panel);min-width:0;min-height:0}.left{border-right:1px solid var(--line);display:flex;flex-direction:column}.right{border-left:1px solid var(--line);overflow:auto;padding:10px}
    .filters{padding:10px;display:grid;grid-template-columns:1fr 110px;gap:7px;border-bottom:1px solid var(--line)}.filters input{grid-column:1/-1}.list{overflow:auto;flex:1}.video{padding:9px 10px;border-bottom:1px solid #252c38;cursor:pointer;display:grid;grid-template-columns:20px 1fr auto;gap:6px}.video:hover,.video.active{background:#222a36}.video.active{box-shadow:inset 3px 0 var(--accent)}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{font-size:12px;color:var(--muted)}.badge.complete{color:var(--accent)}.badge.error{color:var(--danger)}
    .batch{padding:9px;border-top:1px solid var(--line);display:flex;gap:7px;flex-wrap:wrap}.center{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden}.toolbar{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;flex-wrap:wrap;flex:none}.canvas-wrap{position:relative;flex:1 1 auto;min-height:0;background:#090b0f;overflow:hidden;display:flex;align-items:center;justify-content:center}.canvas-wrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}.empty{position:absolute;color:var(--muted);text-align:center}
    .status{padding:9px 12px;border-top:1px solid var(--line);min-height:39px;flex:none}.status.error{color:#ff9aa5}.card{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:10px;background:#151a22}.card h2{font-size:14px;margin:0 0 9px}.preview{width:100%;aspect-ratio:16/9;background:#090b0f;object-fit:contain;display:block}.coords{width:100%;border-collapse:collapse}.coords td{padding:5px;border-bottom:1px solid #29303c}.coords td:first-child{font-weight:700;width:40px}.shortcuts{line-height:1.75}.frame-nav{display:flex;gap:6px;align-items:center}.frame-nav input{width:82px}.progress{font-variant-numeric:tabular-nums}
    @media(max-width:1100px){main{grid-template-columns:250px 1fr}.right{display:none}}
  </style>
</head>
<body>
<header><h1>屏幕四角人工标注</h1><span id="overall" class="muted">正在加载视频…</span><span class="grow"></span><span id="currentTitle" class="muted">请选择视频</span></header>
<main>
  <aside class="left">
    <div class="filters"><input id="search" placeholder="搜索文件名或路径"><select id="category"><option value="">全部分类</option></select><select id="stateFilter"><option value="">全部状态</option><option value="pending">未开始</option><option value="started">标注中</option><option value="complete">已完成</option><option value="error">错误</option></select></div>
    <div id="videoList" class="list"></div>
    <div class="batch"><button id="selectPending">选择所有未完成</button><button id="startBatch" class="primary">开始所选批次</button></div>
  </aside>
  <section class="center">
    <div class="toolbar">
      <button id="prev">← 上一帧</button><button id="next">下一帧 →</button>
      <div class="frame-nav"><span>帧</span><input id="frameInput" type="number" min="0"><button id="jump">跳转</button></div>
      <span class="grow"></span><span id="frameProgress" class="progress muted">—</span>
      <button id="fit">适应画面 (F)</button><button id="undo">撤销 (U)</button><button id="reset">重置 (R)</button>
    </div>
    <div id="canvasWrap" class="canvas-wrap"><canvas id="canvas"></canvas><div id="empty" class="empty">从左侧选择一个视频开始标注</div></div>
    <div class="toolbar"><button id="back">返回列表 (B)</button><button id="skipClip">跳过视频 (N)</button><span class="grow"></span><button id="delete" class="danger">删除本帧标注</button><button id="skip">跳过当前帧 (Esc)</button><button id="save" class="primary">保存并继续 (Enter)</button></div>
    <div id="status" class="status muted">依次点击 TL、TR、BR、BL；拖动已有点可调整。滚轮缩放，按住空格/中键/右键拖动画面。</div>
  </section>
  <aside class="right">
    <div class="card"><h2>透视预览</h2><img id="preview" class="preview" alt="选择四个有效角点后显示预览"><div id="previewText" class="muted" style="margin-top:7px">等待四个角点</div></div>
    <div class="card"><h2>原始视频坐标</h2><table class="coords"><tbody id="coords"></tbody></table></div>
    <div class="card shortcuts"><h2>操作说明</h2><div class="muted">点击顺序：TL → TR → BR → BL<br>鼠标滚轮：以指针为中心缩放<br>空格/中键/右键 + 拖动：平移放大视图<br>Enter 保存　Esc 跳过　U 撤销　R 重置<br>F 完整画面　N 跳过视频　B 返回列表</div></div>
  </aside>
</main>
<script>
const $=s=>document.querySelector(s), labels=['TL','TR','BR','BL'];
const state={videos:[],video:null,annotations:{},frame:0,points:[],image:null,scale:1,ox:0,oy:0,drag:-1,panning:false,space:false,batch:[],previewTimer:null};
const api=async(url,options={})=>{const r=await fetch(url,options);if(!r.ok){let e;try{e=(await r.json()).error}catch{}throw new Error(e||`请求失败 (${r.status})`)}return r};
const q=v=>encodeURIComponent(v), canvas=$('#canvas'),ctx=canvas.getContext('2d'),wrap=$('#canvasWrap');
function status(text,error=false){$('#status').textContent=text;$('#status').className='status '+(error?'error':'muted')}
async function loadVideos(){try{state.videos=(await (await api('/api/videos')).json()).videos;renderFilters();renderVideos();updateOverall()}catch(e){status(e.message,true)}}
function renderFilters(){const old=$('#category').value,cats=[...new Set(state.videos.map(v=>v.category))];$('#category').innerHTML='<option value="">全部分类</option>'+cats.map(c=>`<option>${c}</option>`).join('');$('#category').value=old}
function filtered(){const text=$('#search').value.toLowerCase(),cat=$('#category').value,st=$('#stateFilter').value;return state.videos.filter(v=>(!text||(v.id+v.name).toLowerCase().includes(text))&&(!cat||v.category===cat)&&(!st||v.status===st))}
function renderVideos(){const list=$('#videoList');list.innerHTML='';for(const v of filtered()){const row=document.createElement('div');row.className='video'+(state.video?.id===v.id?' active':'');const checked=state.batch.includes(v.id);row.innerHTML=`<input type="checkbox" ${checked?'checked':''}><div><div class="name" title="${v.id}">${v.name}</div><div class="badge">${v.category}</div></div><div class="badge ${v.status}">${v.status==='error'?'错误':`${v.done||0}/${v.total||0}`}</div>`;row.onclick=e=>{if(e.target.type==='checkbox'){toggleBatch(v.id,e.target.checked);return}openVideo(v)};list.append(row)}}
function toggleBatch(id,on){state.batch=on?[...new Set([...state.batch,id])]:state.batch.filter(x=>x!==id)}
function updateOverall(){const ok=state.videos.filter(v=>v.status==='complete').length;$('#overall').textContent=`${ok}/${state.videos.length} 个视频已完成`}
async function openVideo(v,preferred=null){if(v.status==='error'){status(v.error||'该视频无法标注',true);return}state.video=v;try{state.annotations=(await (await api(`/api/annotations?video=${q(v.id)}`)).json()).annotations;const first=preferred??v.keyframes.find(f=>!state.annotations[f])??v.keyframes[0]??0;await loadFrame(first);renderVideos();$('#currentTitle').textContent=`${v.category} / ${v.name}`}catch(e){status(e.message,true)}}
async function loadFrame(frame){if(!state.video)return;frame=Math.max(0,Math.min(state.video.frameCount-1,Number(frame)));const image=new Image();image.onload=()=>{state.image=image;state.frame=frame;state.points=(state.annotations[frame]||[]).map(p=>[...p]);fit();syncUI();status(state.points.length===4?'已加载本帧标注，可拖动修改或直接保存。':'请依次标注 TL、TR、BR、BL。');preview()};image.onerror=()=>status('视频帧加载失败',true);image.src=`/api/frame?video=${q(state.video.id)}&frame=${frame}&t=${Date.now()}`}
function fit(){if(!state.image)return;const rect=wrap.getBoundingClientRect();canvas.width=Math.max(1,Math.floor(rect.width));canvas.height=Math.max(1,Math.floor(rect.height));state.scale=Math.min(canvas.width/state.image.width,canvas.height/state.image.height);state.ox=(canvas.width-state.image.width*state.scale)/2;state.oy=(canvas.height-state.image.height*state.scale)/2;draw()}
function screenPoint(p){return[p[0]*state.scale+state.ox,p[1]*state.scale+state.oy]}function imagePoint(x,y){return[(x-state.ox)/state.scale,(y-state.oy)/state.scale]}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(!state.image)return;ctx.drawImage(state.image,state.ox,state.oy,state.image.width*state.scale,state.image.height*state.scale);const pts=state.points.map(screenPoint);if(pts.length>1){ctx.strokeStyle='#39e798';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(...pts[0]);pts.slice(1).forEach(p=>ctx.lineTo(...p));if(pts.length===4)ctx.closePath();ctx.stroke()}pts.forEach((p,i)=>{ctx.fillStyle='#ff4964';ctx.strokeStyle='white';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(...p,6,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='white';ctx.font='bold 13px system-ui';ctx.fillText(labels[i],p[0]+10,p[1]-10)})}
function nearest(x,y){let best=-1,d=14;state.points.forEach((p,i)=>{const s=screenPoint(p),n=Math.hypot(s[0]-x,s[1]-y);if(n<d){d=n;best=i}});return best}
canvas.oncontextmenu=e=>e.preventDefault();
canvas.onpointerdown=e=>{if(!state.image)return;canvas.setPointerCapture(e.pointerId);if(state.space||e.button===1||e.button===2){e.preventDefault();state.panning=true;state.last=[e.clientX,e.clientY];return}const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,n=nearest(x,y);if(n>=0)state.drag=n;else if(state.points.length<4){let p=imagePoint(x,y);p=[Math.max(0,Math.min(state.image.width-1,p[0])),Math.max(0,Math.min(state.image.height-1,p[1]))];state.points.push(p);state.drag=state.points.length-1;changed()}};
canvas.onpointermove=e=>{if(state.panning){state.ox+=e.clientX-state.last[0];state.oy+=e.clientY-state.last[1];state.last=[e.clientX,e.clientY];draw();return}if(state.drag<0)return;const r=canvas.getBoundingClientRect();let p=imagePoint(e.clientX-r.left,e.clientY-r.top);state.points[state.drag]=[Math.max(0,Math.min(state.image.width-1,p[0])),Math.max(0,Math.min(state.image.height-1,p[1]))];changed()};
canvas.onpointerup=()=>{state.drag=-1;state.panning=false;preview()};canvas.onwheel=e=>{if(!state.image)return;e.preventDefault();const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,before=imagePoint(x,y),factor=e.deltaY<0?1.2:1/1.2,fitScale=Math.min(canvas.width/state.image.width,canvas.height/state.image.height);state.scale=Math.max(fitScale,Math.min(fitScale*30,state.scale*factor));state.ox=x-before[0]*state.scale;state.oy=y-before[1]*state.scale;draw()};
function changed(){draw();syncCoords();clearTimeout(state.previewTimer);state.previewTimer=setTimeout(preview,180)}
function syncUI(){const k=state.video.keyframes,i=k.indexOf(state.frame);$('#frameInput').value=state.frame;$('#frameInput').max=state.video.frameCount-1;$('#frameProgress').textContent=`关键帧 ${i>=0?i+1:'自定义'}/${k.length} · 视频帧 ${state.frame}/${state.video.frameCount-1}`;$('#empty').style.display='none';syncCoords();draw()}
function syncCoords(){$('#coords').innerHTML=labels.map((l,i)=>`<tr><td>${l}</td><td>${state.points[i]?`${state.points[i][0].toFixed(1)}, ${state.points[i][1].toFixed(1)}`:'—'}</td></tr>`).join('');$('#save').disabled=state.points.length!==4;$('#delete').disabled=!state.annotations[state.frame]}
async function preview(){if(state.points.length!==4){$('#preview').removeAttribute('src');$('#previewText').textContent=`下一点：${labels[state.points.length]}`;return}try{const r=await api('/api/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({video:state.video.id,frame:state.frame,corners:state.points})});const blob=await r.blob(),old=$('#preview').src;$('#preview').src=URL.createObjectURL(blob);if(old.startsWith('blob:'))URL.revokeObjectURL(old);$('#previewText').textContent='四边形有效，可以保存';status('四边形有效，可以保存。')}catch(e){$('#preview').removeAttribute('src');$('#previewText').textContent=e.message;status(e.message,true)}}
function adjacent(delta){if(!state.video)return;const k=state.video.keyframes,i=k.indexOf(state.frame);loadFrame(k[Math.max(0,Math.min(k.length-1,(i<0?0:i)+delta))])}
async function save(){if(state.points.length!==4)return;try{await api('/api/annotations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({video:state.video.id,frame:state.frame,corners:state.points})});state.annotations[state.frame]=state.points.map(p=>[...p]);status(`第 ${state.frame} 帧已保存。`);await refreshCurrent();advance()}catch(e){status(e.message,true)}}
async function remove(){if(!state.video||!confirm(`删除第 ${state.frame} 帧的已保存标注？`))return;try{await api(`/api/annotations?video=${q(state.video.id)}&frame=${state.frame}`,{method:'DELETE'});delete state.annotations[state.frame];state.points=[];syncUI();preview();await refreshCurrent();status('本帧标注已删除。')}catch(e){status(e.message,true)}}
async function refreshCurrent(){const id=state.video.id;const data=(await (await api('/api/videos')).json()).videos;state.videos=data;state.video=data.find(v=>v.id===id)||state.video;updateOverall();renderVideos()}
function advance(){const pending=state.video.keyframes.find(f=>f>state.frame&&!state.annotations[f]);if(pending!==undefined){loadFrame(pending);return}const next=state.video.keyframes.find(f=>f>state.frame);if(next!==undefined){loadFrame(next);return}nextBatch()}
function nextBatch(){if(!state.batch.length)return;const i=state.batch.indexOf(state.video.id),ids=[...state.batch.slice(i+1),...state.batch.slice(0,i+1)],next=ids.map(id=>state.videos.find(v=>v.id===id)).find(v=>v&&v.status!=='complete'&&v.id!==state.video.id);if(next)openVideo(next);else status('所选批次已完成。')}
function skipClip(){nextBatch();status('已跳过当前视频。')}
$('#search').oninput=renderVideos;$('#category').onchange=renderVideos;$('#stateFilter').onchange=renderVideos;$('#selectPending').onclick=()=>{state.batch=filtered().filter(v=>v.status!=='complete'&&v.status!=='error').map(v=>v.id);renderVideos()};$('#startBatch').onclick=()=>{const v=state.batch.map(id=>state.videos.find(x=>x.id===id)).find(x=>x&&x.status!=='complete');if(v)openVideo(v);else status('请先选择未完成的视频。',true)};
$('#prev').onclick=()=>adjacent(-1);$('#next').onclick=()=>adjacent(1);$('#jump').onclick=()=>loadFrame($('#frameInput').value);$('#fit').onclick=fit;$('#undo').onclick=()=>{state.points.pop();changed()};$('#reset').onclick=()=>{state.points=[];changed()};$('#save').onclick=save;$('#delete').onclick=remove;$('#skip').onclick=advance;$('#skipClip').onclick=skipClip;$('#back').onclick=()=>{state.batch=[];renderVideos();status('已返回视频列表。')};
window.onkeydown=e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.code==='Space'){state.space=true;e.preventDefault()}else if(e.key==='Enter')save();else if(e.key==='Escape')advance();else if(e.key.toLowerCase()==='u'){state.points.pop();changed()}else if(e.key.toLowerCase()==='r'){state.points=[];changed()}else if(e.key.toLowerCase()==='f')fit();else if(e.key.toLowerCase()==='n')skipClip();else if(e.key.toLowerCase()==='b'){$('#back').click()}};window.onkeyup=e=>{if(e.code==='Space')state.space=false};
let lastWrapWidth=0,lastWrapHeight=0;new ResizeObserver(entries=>{const box=entries[0].contentRect,w=Math.round(box.width),h=Math.round(box.height);if(w===lastWrapWidth&&h===lastWrapHeight)return;lastWrapWidth=w;lastWrapHeight=h;if(state.image)requestAnimationFrame(fit)}).observe(wrap);
loadVideos();
</script>
</body></html>
