<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <text x="56" y="66" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="54" font-weight="700" fill="#111827">Qualitative results preserve content motion</text>
    <text x="56" y="122" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="42" font-weight="600" fill="#5B6472">Hard scenes still expose degraded border evidence</text>
  </g>
  <g id="qualitative-grid">
    <rect x="56" y="154" width="472" height="501" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="2"/>
    <image x="56" y="154" width="472" height="501" href="../images/figure_05_qualitative.png" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="main-observation">
    <rect x="572" y="154" width="652" height="184" fill="#EFF4F8" stroke="#0066FF" stroke-width="2"/>
    <text x="604" y="198" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0066FF">ACROSS THE FIVE SCENE CATEGORIES</text>
    <text x="604" y="248" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="36" font-weight="700" fill="#111827">The normalized view follows the display,</text>
    <text x="604" y="290" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="36" font-weight="700" fill="#111827">not the moving content inside it.</text>
    <text x="604" y="322" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">This is the qualitative signature of a physical-border reference.</text>
  </g>
  <g id="challenge-accuracy">
    <rect x="572" y="366" width="314" height="224" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="2"/>
    <text x="600" y="408" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#5B6472">CHALLENGE RMSE ↓</text>
    <text x="600" y="476" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="64" font-weight="700" fill="#0066FF">10.70</text>
    <text x="600" y="516" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Frame-wise 9.62</text>
    <text x="600" y="552" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Optical flow 24.90</text>
  </g>
  <g id="challenge-stability">
    <rect x="910" y="366" width="314" height="224" fill="#FFFFFF" stroke="#14B8A6" stroke-width="2"/>
    <text x="938" y="408" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#14B8A6">CHALLENGE VARIATION ↓</text>
    <text x="938" y="476" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="64" font-weight="700" fill="#0066FF">3.74</text>
    <text x="938" y="516" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Frame-wise 5.19</text>
    <text x="938" y="552" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Optical flow 8.56</text>
  </g>
  <g id="challenge-summary">
    <line x1="572" y1="620" x2="1224" y2="620" stroke="#111827" stroke-width="2"/>
    <text x="572" y="654" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#111827">On hard clips, accuracy remains competitive while temporal stability stays best.</text>
  </g>
  <g id="footer" data-pptx-role="footer">
    <text x="56" y="690" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#5B6472">QUALITATIVE GRID · INPUT / FRAME-WISE / OPTICAL FLOW / PROPOSED</text>
    <text x="1224" y="690" text-anchor="end" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#5B6472">09</text>
  </g>
</svg>
