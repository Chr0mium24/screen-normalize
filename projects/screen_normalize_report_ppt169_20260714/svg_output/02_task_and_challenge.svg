<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <text x="56" y="72" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="54" font-weight="700" fill="#111827">Rectifying one frame is easy</text>
    <text x="56" y="132" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="54" font-weight="700" fill="#111827">Resisting content motion is not</text>
    <line x1="56" y1="154" x2="1224" y2="154" stroke="#111827" stroke-width="2"/>
  </g>
  <g id="problem-chain">
    <line x1="88" y1="220" x2="88" y2="578" stroke="#CFD8E3" stroke-width="2"/>
    <circle cx="88" cy="244" r="8" fill="#0066FF"/>
    <circle cx="88" cy="382" r="8" fill="#5B6472"/>
    <circle cx="88" cy="520" r="8" fill="#14B8A6"/>
    <use data-icon="tabler-outline/video" x="118" y="218" width="44" height="44" fill="#0066FF" stroke-width="2"/>
    <text x="182" y="248" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="36" font-weight="600" fill="#111827">Two motions share the same input</text>
    <text x="182" y="292" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#1F2937">Handheld camera motion + scrolling or video inside the screen</text>
    <use data-icon="tabler-outline/activity" x="118" y="356" width="44" height="44" fill="#5B6472" stroke-width="2"/>
    <text x="182" y="386" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="36" font-weight="600" fill="#111827">Common evidence mixes the two</text>
    <text x="182" y="430" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#1F2937">Per-frame detections jitter; internal optical flow drifts</text>
    <use data-icon="tabler-outline/device-desktop" x="118" y="494" width="44" height="44" fill="#14B8A6" stroke-width="2"/>
    <text x="182" y="524" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="36" font-weight="600" fill="#111827">The target is the physical screen plane</text>
    <text x="182" y="568" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#1F2937">Track one quadrilateral and normalize to a fixed frontal view</text>
  </g>
  <g id="core-claim">
    <polygon points="790,232 1176,208 1202,522 814,548" fill="#EFF4F8" stroke="#0066FF" stroke-width="4"/>
    <circle cx="790" cy="232" r="7" fill="#0066FF"/>
    <circle cx="1176" cy="208" r="7" fill="#0066FF"/>
    <circle cx="1202" cy="522" r="7" fill="#0066FF"/>
    <circle cx="814" cy="548" r="7" fill="#0066FF"/>
    <text x="842" y="326" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="600" fill="#0066FF">CORE IDEA</text>
    <text x="842" y="384" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="42" font-weight="700" fill="#111827">The physical border</text>
    <text x="842" y="436" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="42" font-weight="700" fill="#111827">drives the homography</text>
    <text x="842" y="488" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Internal flow only diagnoses conflicts</text>
  </g>
  <g id="footer" data-pptx-role="footer">
    <text x="56" y="690" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#5B6472">TASK · GEOMETRIC FRONT END FOR CAPTURED-SCREEN VIDEO</text>
    <text x="1224" y="690" text-anchor="end" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#5B6472">02</text>
  </g>
</svg>
