    <text x="852" y="196" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="600" fill="#0066FF">3 · FIT FOUR LINES, THEN INTERSECT</text>
    <rect x="852" y="220" width="372" height="278" fill="#EFF4F8" stroke="#CFD8E3" stroke-width="2"/>
    <circle cx="898" cy="292" r="5" fill="#9AA4B2"/><circle cx="930" cy="287" r="5" fill="#9AA4B2"/><circle cx="967" cy="282" r="5" fill="#9AA4B2"/><circle cx="1006" cy="276" r="5" fill="#9AA4B2"/><circle cx="1046" cy="271" r="5" fill="#9AA4B2"/>
    <circle cx="1110" cy="310" r="5" fill="#9AA4B2"/><circle cx="1118" cy="344" r="5" fill="#9AA4B2"/><circle cx="1127" cy="382" r="5" fill="#9AA4B2"/><circle cx="1136" cy="420" r="5" fill="#9AA4B2"/>
    <line x1="886" y1="294" x2="1084" y2="264" stroke="#0066FF" stroke-width="5"/>
    <line x1="1100" y1="268" x2="1146" y2="452" stroke="#0066FF" stroke-width="5"/>
