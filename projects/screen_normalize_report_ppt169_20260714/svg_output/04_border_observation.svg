  </defs>
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <text x="56" y="68" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="54" font-weight="700" fill="#111827">Local profiles search only around predicted borders</text>
    <text x="56" y="126" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="42" font-weight="600" fill="#5B6472">This suppresses interference from internal screen texture</text>
    <line x1="56" y1="150" x2="1224" y2="150" stroke="#111827" stroke-width="2"/>
  </g>
  <g id="predicted-border">
    <text x="56" y="196" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="600" fill="#0066FF">1 · PREDICT A NARROW SEARCH BAND</text>
    <rect x="56" y="220" width="326" height="278" fill="#EFF4F8" stroke="#CFD8E3" stroke-width="2"/>
    <line x1="92" y1="256" x2="340" y2="286" stroke="#9AA4B2" stroke-width="2"/>
    <line x1="92" y1="326" x2="340" y2="354" stroke="#9AA4B2" stroke-width="2"/>
    <line x1="92" y1="396" x2="340" y2="426" stroke="#9AA4B2" stroke-width="2"/>
    <polygon points="105,270 326,292 316,440 118,416" fill="#FFFFFF" stroke="#111827" stroke-width="4"/>
    <polygon points="98,260 334,283 325,450 109,425" fill="none" stroke="#0066FF" stroke-width="4" stroke-dasharray="10 8"/>
    <line x1="318" y1="286" x2="308" y2="445" stroke="#14B8A6" stroke-width="8"/>
    <text x="76" y="478" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Prediction limits where evidence is trusted</text>
  </g>
  <g id="profile-response">
    <line x1="394" y1="356" x2="436" y2="356" stroke="#5B6472" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="454" y="196" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="600" fill="#0066FF">2 · SAMPLE NORMAL PROFILES</text>
    <rect x="454" y="220" width="326" height="278" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="2"/>
    <line x1="490" y1="448" x2="744" y2="448" stroke="#5B6472" stroke-width="2"/>
    <line x1="490" y1="252" x2="490" y2="448" stroke="#5B6472" stroke-width="2"/>
    <polyline points="490,420 520,414 548,408 570,396 592,372 610,284 628,246 646,330 664,386 688,408 716,414 744,420" fill="none" stroke="#0066FF" stroke-width="5"/>
