    <text x="876" y="478" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">RANSAC rejects outliers before corners are updated</text>
  </g>
  <g id="diagnostic-role">
    <rect x="56" y="538" width="1168" height="102" fill="#FFFFFF" stroke="#14B8A6" stroke-width="2"/>
    <use data-icon="tabler-outline/shield-check" x="80" y="563" width="48" height="48" fill="#14B8A6" stroke-width="2"/>
    <text x="152" y="580" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#111827">Internal LK / RANSAC motion is a consistency diagnostic</text>
    <text x="152" y="618" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">It can flag conflict, but it does not replace the border-derived quadrilateral.</text>
  </g>
  <g id="footer" data-pptx-role="footer">
    <text x="56" y="690" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#5B6472">PIPELINE DETAIL · PROFILE-BASED BORDER OBSERVATION</text>
    <text x="1224" y="690" text-anchor="end" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#5B6472">04</text>
  </g>
