<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <text x="56" y="66" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="54" font-weight="700" fill="#111827">The three methods differ mainly</text>
    <text x="56" y="122" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="54" font-weight="700" fill="#111827">in which evidence they trust</text>
  </g>
  <g id="method-comparison-table" data-pptx-replace-with="table">
    <metadata type="application/json">{"name":"method_comparison","x":56,"y":158,"width":1168,"height":440,"strict_grid":true,"column_widths":[250,306,306,306],"row_heights":[72,92,92,92,92],"style":{"font_family":"Arial","font_size":20,"header_font_size":20,"header_fill":"#111827","header_text":"#FFFFFF","body_fill":"#FFFFFF","body_text":"#1F2937","band_fill":"#EFF4F8","border_color":"#CFD8E3","border_width":1,"padding":{"left":12,"right":12,"top":6,"bottom":6},"valign":"middle"},"columns":[{"text":"DECISION AXIS","bold":true},{"text":"FRAME-WISE","align":"ctr","bold":true},{"text":"OPTICAL FLOW","align":"ctr","bold":true},{"text":"PROPOSED","align":"ctr","bold":true}],"rows":[[{"text":"Primary evidence","bold":true},{"text":"Independent screen detection"},{"text":"Internal feature motion"},{"text":"Physical screen border","bold":true,"color":"#0066FF"}],[{"text":"State update","bold":true},{"text":"Restart every frame"},{"text":"Propagate previous corners"},{"text":"Fit four local border lines","bold":true}],[{"text":"Internal motion","bold":true},{"text":"Can perturb detections"},{"text":"Becomes false camera motion"},{"text":"Used only as a diagnostic","bold":true}],[{"text":"Failure signature","bold":true},{"text":"Jitter or frame-wise jumps"},{"text":"Accumulated drift"},{"text":"Hold or redetect when evidence fails","bold":true}]]}</metadata>
    <rect x="56" y="158" width="1168" height="440" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="2"/>
