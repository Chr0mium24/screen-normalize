<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#5B6472"/>
    </marker>
  </defs>
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <text x="56" y="66" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="54" font-weight="700" fill="#111827">The pipeline follows the physical border</text>
    <text x="56" y="122" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="54" font-weight="700" fill="#111827">and uses diagnostics and recovery for continuity</text>
  </g>
  <g id="pipeline-stages">
    <line x1="316" y1="234" x2="340" y2="234" stroke="#5B6472" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="600" y1="234" x2="624" y2="234" stroke="#5B6472" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="884" y1="234" x2="908" y2="234" stroke="#5B6472" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="56" y="158" width="260" height="150" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="2"/>
    <rect x="56" y="158" width="260" height="8" fill="#111827"/>
    <text x="76" y="200" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="600" fill="#5B6472">01 · INITIALIZE</text>
    <text x="76" y="244" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#111827">First-frame corners</text>
    <text x="76" y="282" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Initial quadrilateral</text>
    <rect x="340" y="158" width="260" height="150" fill="#EFF4F8" stroke="#0066FF" stroke-width="2"/>
    <rect x="340" y="158" width="260" height="8" fill="#0066FF"/>
    <text x="360" y="200" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="600" fill="#0066FF">02 · BORDER OBSERVATION</text>
    <text x="360" y="244" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#111827">Profiles + line fit</text>
    <text x="360" y="282" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Four physical edges</text>
    <rect x="624" y="158" width="260" height="150" fill="#FFFFFF" stroke="#14B8A6" stroke-width="2"/>
    <rect x="624" y="158" width="260" height="8" fill="#14B8A6"/>
    <text x="644" y="200" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="600" fill="#14B8A6">03 · VALIDATE + RECOVER</text>
    <text x="644" y="244" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#111827">Gates + LK check</text>
    <text x="644" y="282" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Accept / redetect / hold</text>
    <rect x="908" y="158" width="316" height="150" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="2"/>
    <rect x="908" y="158" width="316" height="8" fill="#111827"/>
    <text x="928" y="200" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="600" fill="#5B6472">04 · STABLE OUTPUT</text>
    <text x="928" y="244" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#111827">Smooth + rectify</text>
    <text x="928" y="282" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Normalized screen video</text>
  </g>
  <g id="pipeline-evidence">
    <rect x="166" y="332" width="948" height="330" fill="#FFFFFF" stroke="#0066FF" stroke-width="2"/>
    <image x="166" y="332" width="948" height="330" href="../images/figure_01_pipeline.png" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="footer" data-pptx-role="footer">
    <text x="56" y="694" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#5B6472">CURRENT METHOD · PROPOSAL_BORDER</text>
    <text x="1224" y="694" text-anchor="end" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#5B6472">03</text>
  </g>
</svg>
