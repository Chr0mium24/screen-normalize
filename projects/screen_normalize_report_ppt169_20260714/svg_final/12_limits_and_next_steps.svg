<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#5B6472"/>
    </marker>
  </defs>
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <text x="56" y="66" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="54" font-weight="700" fill="#111827">Remaining risk comes from reflection, occlusion,</text>
    <text x="56" y="122" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="54" font-weight="700" fill="#111827">and extremely weak border evidence</text>
  </g>
  <g id="failure-process">
    <line x1="304" y1="280" x2="330" y2="280" stroke="#5B6472" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="586" y1="280" x2="612" y2="280" stroke="#5B6472" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="868" y1="280" x2="894" y2="280" stroke="#5B6472" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="56" y="172" width="248" height="216" fill="#FFFFFF" stroke="#D14343" stroke-width="2"/>
    <!-- icon: tabler-outline/alert-triangle -->
  <g transform="translate(80, 198) scale(2)" fill="none" stroke="#D14343" stroke-width="2">
    <path d="M12 9v4" />
    <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0" />
    <path d="M12 16h.01" />
  </g>
    <text x="80" y="280" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#111827">Scene stress</text>
    <text x="80" y="320" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Reflection</text>
    <text x="80" y="350" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Occlusion</text>
    <text x="80" y="380" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Extreme low contrast</text>
    <rect x="338" y="172" width="248" height="216" fill="#EFF4F8" stroke="#CFD8E3" stroke-width="2"/>
    <!-- icon: tabler-outline/scan -->
  <g transform="translate(362, 198) scale(2)" fill="none" stroke="#0066FF" stroke-width="2">
    <path d="M4 7v-1a2 2 0 0 1 2 -2h2" />
    <path d="M4 17v1a2 2 0 0 0 2 2h2" />
    <path d="M16 4h2a2 2 0 0 1 2 2v1" />
    <path d="M16 20h2a2 2 0 0 0 2 -2v-1" />
    <path d="M5 12l14 0" />
  </g>
    <text x="362" y="280" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#111827">Border ambiguity</text>
    <text x="362" y="320" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Weak profile peaks</text>
    <text x="362" y="350" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">False line support</text>
    <text x="362" y="380" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Corner uncertainty</text>
    <rect x="620" y="172" width="248" height="216" fill="#FFFFFF" stroke="#14B8A6" stroke-width="2"/>
    <!-- icon: tabler-outline/shield-check -->
  <g transform="translate(644, 198) scale(2)" fill="none" stroke="#14B8A6" stroke-width="2">
    <path d="M11.46 20.846a12 12 0 0 1 -7.96 -14.846a12 12 0 0 0 8.5 -3a12 12 0 0 0 8.5 3a12 12 0 0 1 -.09 7.06" />
    <path d="M15 19l2 2l4 -4" />
  </g>
    <text x="644" y="280" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#111827">Safety logic</text>
    <text x="644" y="320" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Geometry gates</text>
    <text x="644" y="350" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">LK consistency check</text>
    <text x="644" y="380" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Confidence decision</text>
    <rect x="902" y="172" width="322" height="216" fill="#EFF4F8" stroke="#0066FF" stroke-width="2"/>
    <!-- icon: tabler-outline/refresh -->
  <g transform="translate(926, 198) scale(2)" fill="none" stroke="#0066FF" stroke-width="2">
    <path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" />
    <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" />
  </g>
    <text x="926" y="280" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#111827">Controlled response</text>
    <text x="926" y="320" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Accept a reliable update</text>
    <text x="926" y="350" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Redetect after failure</text>
    <text x="926" y="380" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Otherwise hold last state</text>
  </g>
  <g id="persistent-risk">
    <rect x="56" y="418" width="1168" height="76" fill="#FFFFFF" stroke="#D14343" stroke-width="2"/>
    <text x="84" y="452" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#D14343">If the border stays invisible, reliable corners cannot be recovered.</text>
    <text x="84" y="482" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#5B6472">A weak-border aggregate RMSE of 9.35 px is a major gain, but difficult individual clips can still reach 14.39 px.</text>
  </g>
  <g id="next-improvements">
    <text x="56" y="542" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0066FF">NEXT IMPROVEMENTS</text>
    <line x1="56" y1="560" x2="1224" y2="560" stroke="#CFD8E3" stroke-width="2"/>
    <text x="56" y="604" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#111827">Adaptive profile bands</text>
    <text x="56" y="636" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Expand only when evidence weakens</text>
    <text x="450" y="604" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#111827">Multi-frame redetection</text>
    <text x="450" y="636" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Aggregate evidence before reset</text>
    <text x="844" y="604" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#111827">Confidence-aware output</text>
    <text x="844" y="636" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Expose uncertainty to downstream use</text>
  </g>
  <g id="footer" data-pptx-role="footer">
    <text x="56" y="690" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#5B6472">LIMITATIONS · IMPROVEMENT PRIORITIES</text>
    <text x="1224" y="690" text-anchor="end" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#5B6472">12</text>
  </g>
</svg>
