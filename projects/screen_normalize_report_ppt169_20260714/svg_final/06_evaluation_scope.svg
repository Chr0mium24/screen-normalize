    <text x="614" y="270" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="36" font-weight="700" fill="#111827">Geometry</text>
    <text x="614" y="308" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Corner RMSE ↓  ·  quadrilateral IoU ↑</text>
    <line x1="542" y1="336" x2="1196" y2="336" stroke="#CFD8E3" stroke-width="2"/>
