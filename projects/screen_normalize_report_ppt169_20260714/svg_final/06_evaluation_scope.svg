<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <text x="56" y="66" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="54" font-weight="700" fill="#111827">Formal evidence covers geometry and temporal stability</text>
    <text x="56" y="122" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="42" font-weight="600" fill="#5B6472">The ranked comparison uses 10 annotated clips across five scene categories</text>
  </g>
