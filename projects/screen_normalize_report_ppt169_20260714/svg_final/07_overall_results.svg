<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <text x="56" y="68" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="54" font-weight="700" fill="#111827">The proposed method improves accuracy, overlap,</text>
    <text x="56" y="126" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="54" font-weight="700" fill="#111827">and stability at the same time</text>
  </g>
  <g id="legend">
    <circle cx="810" cy="166" r="7" fill="#9AA4B2"/><text x="826" y="174" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Frame-wise</text>
    <circle cx="980" cy="166" r="7" fill="#5B6472"/><text x="996" y="174" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Optical flow</text>
    <circle cx="1162" cy="166" r="7" fill="#0066FF"/><text x="1178" y="174" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#0066FF">Ours</text>
  </g>
  <g id="rmse-result">
    <rect x="56" y="206" width="360" height="386" fill="#EFF4F8" stroke="#CFD8E3" stroke-width="2"/>
    <text x="84" y="252" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#111827">Corner RMSE ↓</text>
    <text x="84" y="332" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="64" font-weight="700" fill="#0066FF">3.87 px</text>
    <text x="84" y="372" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0066FF">87% lower than the best baseline</text>
    <line x1="84" y1="414" x2="382" y2="414" stroke="#CFD8E3" stroke-width="2"/>
    <text x="84" y="456" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Frame-wise</text><text x="382" y="456" text-anchor="end" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#9AA4B2">30.37</text>
    <text x="84" y="506" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Optical flow</text><text x="382" y="506" text-anchor="end" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#5B6472">31.40</text>
    <text x="84" y="556" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0066FF">Proposed</text><text x="382" y="556" text-anchor="end" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#0066FF">3.87</text>
  </g>
  <g id="iou-result">
    <rect x="460" y="206" width="360" height="386" fill="#FFFFFF" stroke="#CFD8E3" stroke-width="2"/>
    <text x="488" y="252" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#111827">Quadrilateral IoU ↑</text>
    <text x="488" y="332" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="64" font-weight="700" fill="#0066FF">0.996</text>
    <text x="488" y="372" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0066FF">+0.016 over the best baseline</text>
    <line x1="488" y1="414" x2="786" y2="414" stroke="#CFD8E3" stroke-width="2"/>
    <text x="488" y="456" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Frame-wise</text><text x="786" y="456" text-anchor="end" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#9AA4B2">0.980</text>
    <text x="488" y="506" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Optical flow</text><text x="786" y="506" text-anchor="end" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#5B6472">0.979</text>
    <text x="488" y="556" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0066FF">Proposed</text><text x="786" y="556" text-anchor="end" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#0066FF">0.996</text>
  </g>
  <g id="stability-result">
    <rect x="864" y="206" width="360" height="386" fill="#EFF4F8" stroke="#CFD8E3" stroke-width="2"/>
    <text x="892" y="252" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#111827">Translation variation ↓</text>
    <text x="892" y="332" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="64" font-weight="700" fill="#0066FF">2.45</text>
    <text x="892" y="372" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0066FF">13% lower than the best baseline</text>
    <line x1="892" y1="414" x2="1190" y2="414" stroke="#CFD8E3" stroke-width="2"/>
    <text x="892" y="456" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Frame-wise</text><text x="1190" y="456" text-anchor="end" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#9AA4B2">2.83</text>
    <text x="892" y="506" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Optical flow</text><text x="1190" y="506" text-anchor="end" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#5B6472">4.13</text>
    <text x="892" y="556" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0066FF">Proposed</text><text x="1190" y="556" text-anchor="end" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#0066FF">2.45</text>
  </g>
  <g id="result-summary">
    <line x1="56" y1="626" x2="1224" y2="626" stroke="#0066FF" stroke-width="4"/>
    <text x="56" y="666" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#111827">One border-driven trajectory wins all three aggregate metrics.</text>
  </g>
  <g id="footer" data-pptx-role="footer">
    <text x="1224" y="696" text-anchor="end" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#5B6472">07</text>
  </g>
</svg>
