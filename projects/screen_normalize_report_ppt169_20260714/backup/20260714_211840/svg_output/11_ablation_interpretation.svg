<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <text x="56" y="66" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="54" font-weight="700" fill="#111827">Identical metrics do not make the safety modules useless</text>
    <text x="56" y="122" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="42" font-weight="600" fill="#5B6472">Their conditional branches were not triggered on this sequence</text>
  </g>
  <g id="state-counts">
    <rect x="56" y="164" width="354" height="446" fill="#EFF4F8" stroke="#CFD8E3" stroke-width="2"/>
    <text x="84" y="206" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0066FF">WHAT THE RUN ACTUALLY DID</text>
    <text x="84" y="294" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="64" font-weight="700" fill="#111827">1</text>
    <text x="168" y="288" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#111827">initial frame</text>
    <text x="168" y="320" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">initial quadrilateral</text>
    <line x1="84" y1="346" x2="382" y2="346" stroke="#CFD8E3" stroke-width="2"/>
    <text x="84" y="432" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="64" font-weight="700" fill="#0066FF">298</text>
    <text x="236" y="426" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#111827">edge accepts</text>
    <text x="236" y="458" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">Profile succeeds directly</text>
    <line x1="84" y1="484" x2="382" y2="484" stroke="#CFD8E3" stroke-width="2"/>
    <text x="84" y="570" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="64" font-weight="700" fill="#14B8A6">0</text>
    <text x="168" y="564" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#111827">held frames</text>
    <text x="168" y="596" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">no recovery path used</text>
  </g>
  <g id="conditional-module-list">
    <line x1="452" y1="186" x2="452" y2="576" stroke="#CFD8E3" stroke-width="3"/>
    <circle cx="452" cy="224" r="9" fill="#0066FF"/>
    <use data-icon="tabler-outline/activity" x="482" y="196" width="48" height="48" fill="#0066FF" stroke-width="2"/>
    <text x="554" y="224" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="36" font-weight="700" fill="#111827">LK consistency diagnostic</text>
    <text x="554" y="260" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">No decisive border–motion conflict → removing it does not change output.</text>
    <line x1="482" y1="290" x2="1224" y2="290" stroke="#CFD8E3" stroke-width="2"/>
    <circle cx="452" cy="352" r="9" fill="#14B8A6"/>
    <use data-icon="tabler-outline/refresh" x="482" y="324" width="48" height="48" fill="#14B8A6" stroke-width="2"/>
    <text x="554" y="352" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="36" font-weight="700" fill="#111827">Automatic redetection</text>
    <text x="554" y="388" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">The accepted edge observation never failed → redetection was not called.</text>
    <line x1="482" y1="418" x2="1224" y2="418" stroke="#CFD8E3" stroke-width="2"/>
    <circle cx="452" cy="480" r="9" fill="#5B6472"/>
    <use data-icon="tabler-outline/filter" x="482" y="452" width="48" height="48" fill="#5B6472" stroke-width="2"/>
    <text x="554" y="480" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="36" font-weight="700" fill="#111827">Edge gates</text>
    <text x="554" y="516" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">All candidates already passed the original gates → relaxing them adds nothing.</text>
  </g>
  <g id="interpretation">
    <rect x="452" y="550" width="772" height="92" fill="#FFFFFF" stroke="#0066FF" stroke-width="3"/>
    <text x="480" y="586" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#0066FF">Ablation measures realized contribution, not latent safety value.</text>
    <text x="480" y="620" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#5B6472">These modules matter when the default border observation becomes unreliable.</text>
  </g>
  <g id="footer" data-pptx-role="footer">
    <text x="56" y="690" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#5B6472">ABLATION INTERPRETATION · EXECUTION COUNTS EXPLAIN EQUAL METRICS</text>
    <text x="1224" y="690" text-anchor="end" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#5B6472">11</text>
  </g>
</svg>
